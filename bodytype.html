<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>你的體重，卡在哪個循環？｜不痛生活改造局</title>
<meta name="description" content="25 題，7 分鐘。不只看體重，看體脂、作息、壓力與復胖史，判斷你的體態落在六種循環裡的哪一格。">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F5; --paper2:#F4F1EA; --ink:#181A19; --ink2:#2C302E; --ink3:#8A857C;
  --line:#E6E1D6; --card:#FFFFFF;
  --a:#B4472C; --a-soft:#F4E4DE;
  --b:#1E5641; --b-soft:#EBF3EE;
  --warn:#8C5A12; --warn-soft:#F7EAD3;
  --r:16px;
  --f:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft JhengHei",sans-serif;
  --fs:"Noto Serif TC",Georgia,serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#131211; --paper2:#1A1917; --ink:#F2EEE6; --ink2:#BCB4A8; --ink3:#7E766B;
    --line:#2E2B27; --card:#1D1B18;
    --a:#E08464; --a-soft:#33211B;
    --b:#63A98C; --b-soft:#16261F;
    --warn:#DDA94F; --warn-soft:#2E2415;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f);
  font-size:16.5px; line-height:1.8; letter-spacing:.01em;
  min-height:100vh; display:flex; justify-content:center;
  padding:0 0 env(safe-area-inset-bottom);
}
#app{width:100%; max-width:680px; padding:0 22px 64px}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:0; background:none; color:inherit}
.appear{animation:up .42s cubic-bezier(.22,.7,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 0;position:sticky;top:0;background:var(--paper);z-index:10}
.brand{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--ink3)}
.brand i{font-style:normal;color:var(--b)}
.save{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;opacity:0;transition:opacity .3s}
.save.on{opacity:1}

.bar{height:2px;background:var(--line);margin:16px 0 0;overflow:hidden;border-radius:2px}
.bar>i{display:block;height:100%;width:0;background:var(--b);transition:width .45s cubic-bezier(.4,0,.2,1)}
.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);letter-spacing:.08em;margin-top:9px}

.sec-tag{display:inline-block;font-size:11.5px;letter-spacing:.16em;color:var(--b);font-weight:700;margin:32px 0 6px}
.q{font-family:var(--fs);font-size:25px;line-height:1.5;font-weight:900;letter-spacing:0;margin:0 0 8px}
.q small{display:block;font-size:13.5px;line-height:1.7;font-weight:400;color:var(--ink3);letter-spacing:0;margin-top:9px}
.fields{display:flex;flex-direction:column;gap:26px;margin-top:24px}
.field{opacity:.55;transition:opacity .3s}
.field.done{opacity:1}
.f-label{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.hint{font-size:12px;font-weight:400;color:var(--ink3);margin-left:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:100px;padding:9px 17px;
  font-size:14px;font-weight:600;color:var(--ink2);transition:all .18s}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--b);background:var(--b);color:#fff}

.stack{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);
  background:var(--card);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--ink2);transition:all .18s}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--b);background:var(--b-soft);color:var(--ink);font-weight:600}
.tick{flex:0 0 18px;height:18px;border-radius:5px;border:1.5px solid var(--line);margin-top:2px;
  display:grid;place-items:center;transition:all .18s}
.opt.on .tick{border-color:var(--b);background:var(--b)}
.tick::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;
  transform:rotate(-45deg) translateY(-1px);opacity:0}
.opt.on .tick::after{opacity:1}

.numwrap{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding-bottom:8px;transition:border-color .2s}
.numwrap:focus-within{border-color:var(--b)}
.numwrap input{flex:0 0 auto;width:3.6em;border:0;background:none;font:inherit;font-size:22px;font-weight:700;color:var(--ink);outline:none;text-align:left}
.numwrap input::placeholder{color:var(--ink3);font-weight:400;font-size:15px}
.numwrap span{font-size:13px;color:var(--ink3);font-weight:600}
.err{font-size:12px;color:var(--a);margin-top:8px;display:none}
.err.on{display:block}

.nav{display:flex;gap:10px;align-items:center;margin-top:38px}
.btn{background:var(--b);color:#fff;border-radius:10px;padding:15px 26px;font-size:15px;
  font-weight:700;letter-spacing:.02em;transition:all .2s;flex:1;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;color:var(--ink3);flex:0 0 auto;padding:15px 12px;font-weight:600}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.accent{background:#143E2E;color:#fff}

.hero{margin-top:26px}
.hero .kicker{font-size:11.5px;letter-spacing:.18em;color:var(--ink3);font-weight:700}
.hero .block{font-size:15px;font-weight:700;margin-top:16px;letter-spacing:.06em}
.hero h1{font-family:var(--fs);font-size:32px;line-height:1.35;font-weight:900;letter-spacing:0;margin:8px 0 0}
.hero .lede{font-size:16.5px;line-height:1.8;color:var(--ink2);margin-top:16px}
.matrix{display:flex;gap:12px;align-items:center;margin-top:24px;padding:16px;background:var(--card);
  border:1.5px solid var(--line);border-radius:var(--r)}
.grid2x3{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:0 0 132px}
.cell{height:30px;border-radius:6px;background:var(--paper2);display:grid;place-items:center;
  font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:0}
.cell.on{color:#fff;transform:scale(1.04)}
.matrix .side{font-size:12.5px;line-height:1.7;color:var(--ink2)}
.matrix .side b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px}

.warn{margin-top:22px;padding:18px;border-radius:var(--r);background:var(--warn-soft);border:1.5px solid var(--warn)}
.warn h3{margin:0 0 8px;font-size:15px;color:var(--warn);font-weight:800;letter-spacing:.02em}
.warn p{margin:0;font-size:14px;line-height:1.8;color:var(--ink2)}

.verdict{margin-top:20px;font-size:19px;line-height:1.7;font-weight:700;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.tag{font-size:12px;font-weight:700;letter-spacing:.02em;padding:5px 11px;border-radius:100px;
  background:var(--b-soft);color:var(--b)}

.paths{display:flex;gap:10px;margin:0 0 26px}
.path{flex:1;display:block;padding:12px 14px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--card);text-decoration:none;color:inherit}
.path b{display:block;font-size:14px;font-weight:800;color:var(--ink2)}
.path span{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.55}
.path.on{border-color:var(--b);background:var(--b-soft)}
.path.on b{color:var(--b)}

.xlink{display:block;margin-top:26px;padding:16px 18px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--card);text-decoration:none}
.xlink b{display:block;font-size:14px;font-weight:800;color:var(--b)}
.xlink span{display:block;font-size:13px;line-height:1.7;color:var(--ink2);margin-top:5px}
.hr{height:1px;background:var(--line);margin:32px 0 0}
.s-title{font-size:12px;letter-spacing:.16em;color:var(--ink3);font-weight:800;margin:34px 0 14px}
.moves{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px}
.moves li{display:flex;gap:14px;align-items:flex-start}
.moves i{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-style:normal;font-size:12.5px;font-weight:800;display:grid;place-items:center;margin-top:3px}
.moves b{display:block;font-size:15.5px;font-weight:800;margin-bottom:3px}
.moves p{margin:0;font-size:14px;line-height:1.8;color:var(--ink2)}
.quote{border-left:3px solid var(--a);padding:4px 0 4px 18px;margin-top:30px;font-size:17px;
  line-height:1.75;font-weight:700;color:var(--ink)}

.nums{margin-top:14px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-size:14.5px;font-weight:700}
.row .k small{display:block;font-size:11.5px;font-weight:400;color:var(--ink3);line-height:1.65;margin-top:3px}
.row .v{font-size:19px;font-weight:900;white-space:nowrap;letter-spacing:-.01em}
.row .v em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink3);margin-left:3px}

.proof{margin-top:16px;padding:18px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r)}
.proof p{margin:0 0 10px;font-size:14px;line-height:1.8;color:var(--ink2)}
.proof cite{font-style:normal;font-size:12px;font-weight:700;color:var(--ink3)}

.cta{margin-top:34px;padding:24px;border-radius:var(--r);background:var(--b);color:#fff}
.cta h3{margin:0;font-size:19px;font-weight:900;letter-spacing:-.01em;line-height:1.45}
.cta p{margin:9px 0 0;font-size:13.5px;line-height:1.8;opacity:.72}
.cta a{display:block;text-align:center;margin-top:18px;background:var(--paper);color:#143E2E;
  border-radius:100px;padding:14px;font-size:15px;font-weight:800;text-decoration:none}
.cta .note{font-size:11px;opacity:.45;text-align:center;margin-top:11px}

.gate{margin-top:20px;padding:24px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line)}
.gate h3{margin:0;font-size:16.5px;font-weight:800}
.gate p{margin:7px 0 0;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.gate input{width:100%;margin-top:16px;border:1.5px solid var(--line);background:var(--paper);
  border-radius:11px;padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);outline:none}
.gate input:focus{border-color:var(--b)}
.gate .btn{width:100%;margin-top:10px}
.gate .ok{font-size:13.5px;color:var(--b);font-weight:700;margin-top:12px;display:none}
.gate .ok.on{display:block}
.privacy{font-size:11px;color:var(--ink3);margin-top:11px;line-height:1.7}

.share{margin-top:22px;display:flex;gap:10px}
.share button{flex:1;padding:13px;border-radius:100px;border:1.5px solid var(--line);
  font-size:13.5px;font-weight:700;color:var(--ink2)}
.share button:active{transform:scale(.98)}

.foot{margin-top:36px;font-size:11.5px;line-height:1.85;color:var(--ink3)}
.foot .again{display:inline-block;margin-top:14px;text-decoration:underline;font-weight:700;color:var(--ink2)}

.intro h1{font-family:var(--fs);font-size:30px;line-height:1.4;font-weight:900;letter-spacing:0;margin:30px 0 0}
.intro .lede{font-size:16px;line-height:1.85;color:var(--ink2);margin-top:16px}
.intro .bullets{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.intro .bullets li{font-size:14.5px;line-height:1.7;color:var(--ink2);padding-left:22px;position:relative}
.intro .bullets li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;
  border-radius:50%;background:var(--b)}
.intro .who{margin-top:26px;padding:16px 18px;background:var(--card);border-radius:var(--r);
  border-left:3px solid var(--b);font-size:13.5px;line-height:1.8;color:var(--ink2)}
.embed body{background:transparent}
.embed .top{background:transparent;position:static;padding-top:0}
.embed #app{padding-bottom:24px}
/* 手機閱讀與操作：保留既有題目、計算及資料儲存邏輯。 */
:root { --paper:#FAF9F5; --paper2:#F1F2EC; --ink:#173B3D; --ink2:#294B4C; --ink3:#596D6D; --line:#DDDCD3; --b:#0B6F73; --b-soft:#E7F3F1; }
@media (prefers-color-scheme:dark) {
  :root { --paper:#131D1D; --paper2:#1C2928; --ink:#EDF5F1; --ink2:#D0DFD9; --ink3:#A8BDB5; --line:#40514C; --card:#20302E; --b:#82CEC2; --b-soft:#253F3A; }
  .chip.on { color:#102B29; }
  .btn:not(.ghost), .cta { background:#276E69; color:#fff; }
}
#app { padding-left:max(20px, env(safe-area-inset-left)); padding-right:max(20px, env(safe-area-inset-right)); }
.top { gap:12px; padding-top:max(16px, env(safe-area-inset-top)); }
.brand, .save { letter-spacing:.03em; }
.save { text-align:right; }
.field { opacity:1; }
.f-label { font-size:16px; }
.hint, .q small { font-size:14px; }
.chip, .opt { min-height:48px; font-size:16px; line-height:1.5; }
.chip { padding:10px 17px; }
.opt { align-items:center; padding:12px 14px; }
.tick { margin-top:0; }
.numwrap input { min-height:48px; }
.btn { min-height:56px; font-size:16px; }
.btn.accent { background:#0B6F73; }
.btn.ghost { color:var(--ink2); }
.path { min-width:0; }
.path b { font-size:16px; }
.path span { font-size:13px; }
.gate input { min-height:48px; font-size:16px; }
.share button { min-height:48px; font-size:15px; }
button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid #0D8F95; outline-offset:3px; }
@media (max-width:360px) {
  .paths { flex-direction:column; gap:8px; }
  .path { padding:10px 14px; }
  .path span { margin-top:1px; }
  .matrix { flex-wrap:wrap; }
  .nav { gap:8px; }
  .btn { padding-left:16px; padding-right:16px; }
  .share { flex-wrap:wrap; }
  .share button { flex:1 1 160px; }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">不痛生活改造局 <i>／</i> 體態類型檢測</div>

</div>

<script>
var CONFIG = {
  brand: "不痛生活改造局",
  site: "ergopt.blogspot.com",
  courseName: "1 小時線上環境改造：告別工作與生活的全身痠痛",
  courseDesc: "Noah｜人因工程師 × 物理治療師。用一小時看完你的工作與生活環境，找出真正在偷走你身體的那幾件事。",
  ctaLabel: "預約 1 小時線上環境改造",
  ctaUrl: "https://portaly.cc/cola_pt",
  endpoint: "",
  pdfName: "體態類型檢測_完整版.pdf",
  storageKey: "ergo-bodytype-quiz-v1",
  proofEnabled: false
};

var PROOF = [
  { text: "本來以為是體重問題，結果是每天搬貨的方式。改成貼身搬之後，下背兩個月沒再抽。", who: "物流組長，43 歲" },
  { text: "我是坐整天的。與其去健身房，先把椅子跟螢幕弄對，肩頸就差很多。", who: "會計，38 歲" }
];

var ORDER = ["loop", "clock", "push"];
var AXIS_NAME = { push: "壓力", clock: "作息", loop: "復胖" };
var BASES = {
  load: { name: "大基數", side: "體重與體脂一起偏高" },
  held: { name: "泡芙", side: "體重正常，體脂偏高" }
};

var TYPES = {
  "load-push": {
    name: "壓力囤積型",
    lede: "你不是吃得多，是壓力一來，身體就切換成囤積模式。越累越想吃、吃了更累，這不是意志力問題，是生理設定。",
    verdict: "體重只是結果。真正在驅動的是「撐住—爆吃—自責—再撐住」這個循環。",
    tags: ["壓力一來就想吃", "越累越難控制", "吃完更累", "體重只是結果"],
    moves: [
      { t: "先斷開「壓力→吃」那條線", d: "把下午與深夜的進食時間往前移，先吃蛋白質與纖維，讓血糖不要掉。血糖一掉，再強的意志力也撐不住。" },
      { t: "睡眠是最便宜的減脂工具", d: "睡不到六小時，飢餓素上升、飽足素下降，隔天多吃的熱量不是靠決心能抵掉的。先固定起床時間，比規定自己幾點睡有用。" },
      { t: "強度降一級，但不要停", d: "大基數階段先求每天走得到，別一開始就跑步跳躍。膝蓋與恢復會先罷工，然後你就會停三個月。" }
    ],
    pull: "你不是控制不了嘴，你是在用食物處理壓力。",
    block: "體重是壓力的帳單，不是你的個性。"
  },
  "load-clock": {
    name: "作息失衡型",
    lede: "你的體重跟時間綁在一起：睡不夠、吃太晚、動太少。不是哪一餐出問題，是整天的節律歪掉了。",
    verdict: "同樣的熱量，晚吃、睡少、久坐，身體就是會存得更多。你缺的不是菜單，是時鐘。",
    tags: ["睡不飽", "吃太晚", "久坐", "白天沒力晚上清醒"],
    moves: [
      { t: "把晚餐往前挪一小時", d: "不用改成五點吃，只要比現在早一小時。進食時間往前，睡眠品質與隔天食慾會一起改善。" },
      { t: "先固定起床時間", d: "多數人管不住睡覺時間，但管得住起床時間。起床固定，生理時鐘就會自己校正回來。" },
      { t: "飯後走十分鐘", d: "餐後走路對血糖的幫助比飯前運動更大。不用換裝、不用場地，吃完就出門。" }
    ],
    pull: "你要調的不是菜單，是時鐘。",
    block: "你不是吃錯，是吃在不對的時間。"
  },

  "load-loop": {
    name: "代謝復胖型",
    lede: "你減得下來，但留不住。每一次回來，掉的都是肌肉，回來的都是脂肪，所以一次比一次難。",
    verdict: "問題不在減重那三個月，在減完之後的四到六週。多數人在那裡收工，所以八週後又回來。",
    tags: ["減得下來留不住", "越減越難", "掉的是肌肉", "每次回來更難"],
    moves: [
      { t: "把速度放慢一半", d: "每週減 0.5 到 1% 體重就夠。減太快掉的多半是肌肉與水，回來的卻全是脂肪。" },

function bindField(f) {
  var wrap = document.querySelector('[data-fid="' + f.id + '"]');
  if (!wrap) return;
  wrap.querySelectorAll("[data-pick]").forEach(function (b) {
    b.onclick = function () {
      var opts = optsOf(f);
      var i = Number(b.dataset.pick);
      var obj = {};
      var src = opts[i][1] || {};
      Object.keys(src).forEach(function (k) { obj[k] = src[k]; });
      obj[f.id] = i;
      obj.label = opts[i][0];
      A[f.id] = obj;
      save(); flash(); paintField(f.id);
      (f.refreshes || []).forEach(function (dep) {
        var df = byId[dep];
        var dv = A[dep];
        if (df && dv != null && df.optsFn) {
          var o = optsOf(df)[dv[dep]];
          if (o) {
            var no = {};
            var s = o[1] || {};
            Object.keys(s).forEach(function (k) { no[k] = s[k]; });
            no[dep] = dv[dep];
            no.label = o[0];
            A[dep] = no;
          }
        }
        paintField(dep);
      });
      save();
    };
  });
  wrap.querySelectorAll("[data-multi]").forEach(function (b) {
    b.onclick = function () {
      var opts = optsOf(f);
      var i = Number(b.dataset.multi);
      var cur = Array.isArray(A[f.id]) ? A[f.id].slice() : [];
      if (isExcl(opts[i])) {
        cur = cur.indexOf(i) >= 0 ? [] : [i];
      } else {
        cur = cur.filter(function (j) { return !isExcl(opts[j]); });
        var at = cur.indexOf(i);
        if (at >= 0) cur.splice(at, 1); else cur.push(i);
      }
      A[f.id] = cur;
      save(); flash(); paintField(f.id);
    };
  });
  wrap.querySelectorAll("[data-num]").forEach(function (inp) {
    inp.oninput = function () {
      inp.value = inp.value.replace(/[^\d]/g, "").slice(0, 3);
      var n = Number(inp.value);
      var err = wrap.querySelector("[data-err]");
      var ok = inp.value !== "" && n >= f.min && n <= f.max;
      if (err) err.classList.toggle("on", inp.value !== "" && !ok);
      if (ok) {
        var obj = {}; obj[f.id] = n; obj.label = String(n);
        A[f.id] = obj;
        wrap.classList.add("done");
      } else {
        delete A[f.id];
        wrap.classList.remove("done");
      }
      save();
      refreshNav();
    };
  });
}
function ptsOf() {
  var pts = { push: 0, clock: 0, loop: 0, load: 0, held: 0 };
  var keys = ["push", "clock", "loop", "load", "held"];
  STEPS.forEach(function (f) {
    var v = A[f.id];
    if (v == null) return;
    if (f.type !== "chips" && f.type !== "stack" && f.type !== "multi") return;
    var list = [];
    if (f.type === "multi") {
      var idx = Array.isArray(v) ? v : [];
      idx.forEach(function (i) { list.push(optsOf(f)[i]); });
    } else {
      list.push(optsOf(f)[getVal(f)]);
    }
    list.forEach(function (o) {
      if (!o || !o[1]) return;
      keys.forEach(function (k) {
        if (typeof o[1][k] === "number") pts[k] += o[1][k];
      });
    });
  });
  return pts;
}

function axisMax() {
  var max = { push: 0, clock: 0, loop: 0, load: 0, held: 0 };
  var keys = ["push", "clock", "loop", "load", "held"];
  STEPS.forEach(function (f) {
    if (f.type !== "chips" && f.type !== "stack" && f.type !== "multi") return;
    var opts = optsOf(f);
    keys.forEach(function (k) {
      var arr = opts.filter(function (o) { return o[1] && typeof o[1][k] === "number"; })
        .map(function (o) { return o[1][k]; })
        .sort(function (x, y) { return y - x; });
      if (!arr.length) return;
      if (f.type === "multi") {
        max[k] += arr.slice(0, 3).reduce(function (s, n) { return s + Math.max(0, n); }, 0);
      } else {
        max[k] += Math.max(0, arr[0]);
      }
    });
  });
  ["push", "clock", "loop"].forEach(function (k) { if (max[k] < 1) max[k] = 1; });
  return max;
}

function compute() {
  var pts = ptsOf();
  var MAX = axisMax();
  var htN = A.ht ? Number(A.ht.ht) : 0;
  var wtN = A.wt ? Number(A.wt.wt) : 0;
  var bmi = htN > 0 && wtN > 0 ? wtN / Math.pow(htN / 100, 2) : null;
  var sex = sexVal() === 1 ? "f" : "m";
  var bf = A.bodyfat && typeof A.bodyfat.bf === "number" ? A.bodyfat.bf : null;

  var load = pts.load;
  var held = pts.held;
  if (bmi !== null) {
    if (bmi >= 27) load += 2;
    else if (bmi >= 24) load += 1;
    else if (bmi >= 18.5) held += 2;
    else held += 3;
  }
  if (bf !== null && bmi !== null && bmi < 27) {
    if ((sex === "m" && bf >= 20) || (sex === "f" && bf >= 25)) held += 2;
  }

  var base = load > held ? "load" : "held";
  var rate = { push: pts.push / MAX.push, clock: pts.clock / MAX.clock, loop: pts.loop / MAX.loop };
  var top = Math.max(rate.push, rate.clock, rate.loop);
  var allZero = pts.push + pts.clock + pts.loop === 0;
  var block = "loop";
  if (!allZero) {
    for (var i = 0; i < ORDER.length; i++) {
      if (rate[ORDER[i]] >= top) { block = ORDER[i]; break; }
    }
  }

  var cared = false;
  if (Array.isArray(A.care)) {
    A.care.forEach(function (i) {
      var o = byId.care.opts[i];
      if (o && o[1] && o[1].flag === 1) cared = true;
    });
  }

  var special = null;
  if (bmi !== null && bmi < 18.5) special = "under";
  else if (top < 0.25) special = "keep";

  return {
    pts: pts, MAX: MAX, rate: rate, base: base, block: block,
    key: base + "-" + block, special: special, bmi: bmi, sex: sex, bf: bf,
    wtN: wtN, htN: htN, load: load, held: held, cared: cared, allZero: allZero
  };
}

function submit(email, R) {

  var payload = {
    ts: new Date().toISOString(),

    push: R.pts.push, clock: R.pts.clock, loop: R.pts.loop,

    email: email || "",

  if (!CONFIG.endpoint) return;
  try {
    fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(function () {});
  } catch (e) {}
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function wrapText(c, text, x0, y0, maxW, lh) {
  var line = "", y = y0;
  for (var i = 0; i < text.length; i++) {
    var t = line + text[i];
    if (c.measureText(t).width > maxW && line) {
      c.fillText(line, x0, y);
      line = text[i];
      y += lh;
    } else {
      line = t;
    }
  }
  if (line) c.fillText(line, x0, y);
  return y;
}

function makeCard(R, T) {
  var W = 1080, H = 1350;
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var x = cv.getContext("2d");
  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches;

  var ink = dark ? "#F2EEE6" : "#1B1F1C";
  var ink3 = dark ? "#7E766B" : "#8A857C";
  var line = dark ? "#2E2B27" : "#E4DFD5";
  var ac = R.cared ? (dark ? "#DDA94F" : "#8C5A12") : R.base === "load" ? (dark ? "#E08464" : "#B4472C") : (dark ? "#63A98C" : "#1E5641");

  var draw = function () {
    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    x.fillStyle = ac; x.fillRect(0, 0, W, 10);
    x.textAlign = "left";
    x.textBaseline = "top";

    x.fillStyle = ink3;
    x.font = '600 26px "Noto Sans TC",sans-serif';
    x.fillText(CONFIG.brand + " ／ 身體負荷檢測", 74, 78);

    x.fillStyle = ac;
    x.font = '800 30px "Noto Sans TC",sans-serif';
    x.fillText(BASES[R.base].name + " × " + AXIS_NAME[R.block], 74, 190);

    x.fillStyle = ink;
    x.font = '900 82px "Noto Sans TC",sans-serif';
    x.fillText(T.name, 74, 244);

    x.fillStyle = ink3;
    x.font = '400 31px "Noto Sans TC",sans-serif';
    wrapText(x, T.lede, 74, 372, W - 148, 52);

    var bars = [["硬撐", R.rate.push], ["沒空", R.rate.clock], ["反覆", R.rate.loop]];
    var by = 648;
    bars.forEach(function (b) {
      x.fillStyle = ink3;
      x.font = '700 25px "Noto Sans TC",sans-serif';
      x.fillText(b[0], 74, by);
      x.fillStyle = line;
      roundRect(x, 190, by + 6, 700, 16, 8); x.fill();
      x.fillStyle = ac;
      var w = Math.max(8, Math.round(700 * Math.min(1, b[1])));
      roundRect(x, 190, by + 6, w, 16, 8); x.fill();
      x.fillStyle = ink;
      x.font = '900 26px "Noto Sans TC",sans-serif';
      x.fillText(Math.round(b[1] * 100) + "%", 916, by);
      by += 76;
    });

    x.fillStyle = ink3;
    x.font = '400 26px "Noto Sans TC",sans-serif';
    var bmiTxt = R.bmi !== null ? "BMI " + R.bmi.toFixed(1) + " · " + (R.bmi >= 27 ? "肥胖" : R.bmi >= 24 ? "過重" : R.bmi >= 18.5 ? "正常" : "過輕") : "BMI 未填";
    var bfTxt = R.bf !== null ? "　·　體脂 " + R.bf + "%" : "";
    x.fillText(bmiTxt + bfTxt, 74, by + 24);

    if (R.wtN && R.htN) {
      var hiW2 = 24 * Math.pow(R.htN / 100, 2);
      x.fillStyle = ink;
      x.font = '700 26px "Noto Sans TC",sans-serif';
      x.fillText(R.wtN > hiW2 ? "理想體重區間 " + (18.5 * Math.pow(R.htN / 100, 2)).toFixed(1) + "–" + hiW2.toFixed(1) + " 公斤" : "體重已在標準區間，重點放在組成", 74, by + 70);
    }

    x.fillStyle = ink;
    x.font = '700 34px "Noto Sans TC",sans-serif';
    wrapText(x, "「" + T.pull + "」", 74, by + 130, W - 148, 56);

    x.fillStyle = line;
    x.fillRect(74, H - 150, W - 148, 1);

    x.fillStyle = ink3;
    x.font = '400 24px "Noto Sans TC",sans-serif';
    x.fillText("28 題 · 8 分鐘 · 免費", 74, H - 112);
    x.textAlign = "right";
    x.fillText(CONFIG.site, W - 74, H - 112);
    x.textAlign = "left";

    cv.toBlob(function (b) {
      if (!b) return;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "身體負荷_" + T.name + ".png";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }, "image/png");
  };

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(draw).catch(draw);
  } else {
    draw();
  }
}
